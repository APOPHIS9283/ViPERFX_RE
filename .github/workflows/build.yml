name: Build Magisk Module

on:
  push:
    branches: ["dev", "main"]
    paths:
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.s"
      - "**.S"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "**.mk"
      - "**.gradle"
      - "**.gradle.kts"
      - "**.properties"
      - "**.aidl"
      - "**.sh"
      - "**.py"
      - "module/**"
      - "ViPERDSP"
      - ".github/workflows/**"
  pull_request:
    branches: ["dev", "main"]
    paths:
      - "**.c"
      - "**.cpp"
      - "**.h"
      - "**.hpp"
      - "**.s"
      - "**.S"
      - "**.cmake"
      - "**/CMakeLists.txt"
      - "**.mk"
      - "**.gradle"
      - "**.gradle.kts"
      - "**.properties"
      - "**.aidl"
      - "**.sh"
      - "**.py"
      - "module/**"
      - "ViPERDSP"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  # ── AIDL: generate stubs once, then compile both ABIs in parallel ─────────
  aidl-gen:
    name: Generate AIDL stubs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Generate AIDL stubs
        run: |
          AIDL=$(ls $ANDROID_HOME/build-tools/*/aidl 2>/dev/null | sort -V | tail -1)
          echo "Using aidl: $AIDL"

          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/hardware/interfaces \
            aosp-interfaces
          cd aosp-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            audio/aidl/android/hardware/audio/effect \
            audio/aidl/android/hardware/audio/common \
            audio/aidl/aidl_api/android.hardware.audio.effect/3 \
            common/aidl/android/hardware/common \
            common/fmq/aidl/android/hardware/common/fmq
          git checkout
          cd ..

          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/system/hardware/interfaces \
            aosp-system-interfaces
          cd aosp-system-interfaces
          git sparse-checkout init --cone
          git sparse-checkout set \
            media/aidl/android/media/audio/common \
            media/aidl/android/media/audio/eraser
          git checkout
          cd ..

          # libbinder_ndk C++ helper headers removed from NDK in r28
          git clone --filter=blob:none --no-checkout --depth=1 \
            https://android.googlesource.com/platform/frameworks/native \
            aosp-frameworks-native
          cd aosp-frameworks-native
          git sparse-checkout init --cone
          git sparse-checkout set libs/binder/ndk/include_cpp/android
          git checkout
          cd ..

          mkdir -p aidl-gen/src \
            aidl-gen/include/android \
            aidl-gen/include/fmq \
            aidl-gen/include/cutils \
            aidl-gen/include/utils \
            aidl-gen/include/android-base

          cp aosp-frameworks-native/libs/binder/ndk/include_cpp/android/*.h aidl-gen/include/android/
          cp -r aidl-shims/include/. aidl-gen/include/

          # Pass 0a: android.hardware.common (NativeHandle etc.)
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src --header_out aidl-gen/include \
            aosp-interfaces/common/aidl/android/hardware/common/*.aidl

          # Pass 0b: android.hardware.common.fmq (MQDescriptor etc.)
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src --header_out aidl-gen/include \
            aosp-interfaces/common/fmq/aidl/android/hardware/common/fmq/*.aidl

          # Pass 0c: android.hardware.audio.common
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/common/*.aidl

          # Pass 1: android.media.audio.common + eraser
          $AIDL --lang=ndk --structured --stability=vintf \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src --header_out aidl-gen/include \
            aosp-system-interfaces/media/aidl/android/media/audio/common/*.aidl \
            aosp-system-interfaces/media/aidl/android/media/audio/eraser/*.aidl

          # Pass 2: effect interfaces
          $AIDL --lang=ndk --structured --stability=vintf \
            --min_sdk_version=31 \
            -I aosp-interfaces/audio/aidl \
            -I aosp-interfaces/common/aidl \
            -I aosp-interfaces/common/fmq/aidl \
            -I aosp-system-interfaces/media/aidl \
            -o aidl-gen/src --header_out aidl-gen/include \
            aosp-interfaces/audio/aidl/android/hardware/audio/effect/*.aidl

          echo "Generated files:"
          find aidl-gen/ -name '*.cpp' -o -name '*.h' | sort

      - name: Upload AIDL gen artifact
        uses: actions/upload-artifact@v7
        with:
          name: aidl-gen-${{ steps.ver.outputs.name }}
          path: aidl-gen/
          retention-days: 1

  # ── AIDL: compile both ABIs in parallel (download shared gen) ────────────
  build-aidl:
    name: Build AIDL (${{ matrix.abi }})
    runs-on: ubuntu-latest
    needs: aidl-gen

    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r29
          add-to-path: false

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download AIDL gen
        uses: actions/download-artifact@v8
        with:
          name: aidl-gen-${{ steps.ver.outputs.name }}
          path: aidl-gen/

      - name: Build AIDL ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          make aidl-${{ matrix.abi }} \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}"

      - name: Upload AIDL .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: libv4a_aidl-${{ matrix.abi }}-${{ steps.ver.outputs.name }}
          path: out/libv4a_aidl_${{ matrix.abi }}.so
          retention-days: 7

  # ── AIDL: package module (no recompile) ──────────────────────────────────
  package-aidl:
    name: Package AIDL module
    runs-on: ubuntu-latest
    needs: build-aidl

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set version variables
        id: ver
        run: |
          echo "name=$(grep '^version=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' module/module.prop | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Download pre-built AIDL .so artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: libv4a_aidl-*-${{ steps.ver.outputs.name }}
          path: out/
          merge-multiple: true

      - name: Prepare AIDL module directory
        run: |
          make module-aidl \
            VERSION_NAME="${{ steps.ver.outputs.name }}" \
            VERSION_CODE="${{ steps.ver.outputs.code }}" \
            SKIP_LIBS=1

      - name: Upload AIDL module artifact
        uses: actions/upload-artifact@v7
        with:
          name: ViPER4Android-RE-AIDL-${{ steps.ver.outputs.name }}
          path: out/magisk_module_aidl/
          retention-days: 30

  # ── Release ───────────────────────────────────────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [package-aidl]
    if: github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if version already released
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep '^version=' module/module.prop | cut -d= -f2)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download AIDL module directory
        if: steps.check.outputs.skip == 'false'
        uses: actions/download-artifact@v8
        with:
          name: ViPER4Android-RE-AIDL-${{ steps.check.outputs.version }}
          path: dist/module-aidl/

      - name: Repackage as flashable zip
        if: steps.check.outputs.skip == 'false'
        run: |
          cd dist/module-aidl && zip -r9 ../ViPER4Android-RE-AIDL-${{ steps.check.outputs.version }}.zip . && cd ../..

      - name: Generate update.json file
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          VERSION_CODE=$(grep '^versionCode=' module/module.prop | cut -d= -f2)
          REPO="${{ github.repository }}"
          CHANGELOG="https://github.com/${REPO}/releases/download/${VERSION}/changelog.md"
          cat > dist/update.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "zipUrl": "https://github.com/${REPO}/releases/download/${VERSION}/ViPER4Android-RE-AIDL-${VERSION}.zip",
            "changelog": "${CHANGELOG}"
          }
          EOF
          echo "--- update.json ---" && cat dist/update.json

      - name: Collect changes from ViPERFX_RE and ViPERDSP submodule
        if: steps.check.outputs.skip == 'false'
        id: changes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # ── ViPERFX_RE: commits since previous release tag ────────────────────
          PREV_TAG=$(gh release list --repo "${{ github.repository }}" \
            --exclude-drafts --limit 10 --json tagName \
            | jq -r '.[].tagName' \
            | grep -v "^${VERSION}$" | head -1)

          if [ -n "$PREV_TAG" ]; then
            FX_LOG=$(git log "${PREV_TAG}..HEAD" \
              --pretty=format:"- %s (%h) by %an" \
              -- ':!ViPERDSP' 2>/dev/null || true)
          else
            FX_LOG=$(git log --max-count=30 \
              --pretty=format:"- %s (%h) by %an" \
              -- ':!ViPERDSP' 2>/dev/null || true)
          fi
          [ -z "$FX_LOG" ] && FX_LOG="(no changes outside ViPERDSP submodule)"

          # ── ViPERDSP: resolve pinned SHAs from tree (no submodule checkout needed)
          CUR_DSP_SHA=$(git ls-tree HEAD ViPERDSP | awk '{print $3}')
          PREV_DSP_SHA=""
          if [ -n "$PREV_TAG" ]; then
            PREV_DSP_SHA=$(git ls-tree "${PREV_TAG}" ViPERDSP 2>/dev/null | awk '{print $3}')
          fi

          # ── ViPERDSP: fetch commit log via GitHub API
          if [ -n "$PREV_DSP_SHA" ] && [ "$PREV_DSP_SHA" != "$CUR_DSP_SHA" ]; then
            DSP_LOG=$(gh api "repos/dungxnd/ViPERDSP/compare/${PREV_DSP_SHA}...${CUR_DSP_SHA}" \
              --jq '.commits[] | "- \(.commit.message | split("\n")[0]) (\(.sha[:7])) by \(.commit.author.name)"' \
              2>/dev/null || true)
          else
            DSP_LOG=$(gh api "repos/dungxnd/ViPERDSP/commits?sha=${CUR_DSP_SHA}&per_page=20" \
              --jq '.[] | "- \(.commit.message | split("\n")[0]) (\(.sha[:7])) by \(.commit.author.name)"' \
              2>/dev/null || true)
          fi
          [ -z "$DSP_LOG" ] && DSP_LOG="(no new ViPERDSP commits)"

          CONTENT_FILE=$(mktemp)
          cat > "$CONTENT_FILE" <<'CONTENT_EOF'
          ## ViPERFX_RE
          CONTENT_EOF
          echo "### Commits" >> "$CONTENT_FILE"
          echo "$FX_LOG"     >> "$CONTENT_FILE"
          echo ""            >> "$CONTENT_FILE"
          printf '## ViPERDSP submodule (dungxnd/ViPERDSP @ %s)\n' "${CUR_DSP_SHA:0:7}" >> "$CONTENT_FILE"
          echo "### Commits" >> "$CONTENT_FILE"
          echo "$DSP_LOG"    >> "$CONTENT_FILE"

          # ── Associated PR description & first comment ─────────────────────
          PR_NUMBER=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            --jq '.[0].number // ""' 2>/dev/null || true)
          if [ -n "$PR_NUMBER" ]; then
            PR_BODY=$(gh api \
              "repos/${{ github.repository }}/pulls/${PR_NUMBER}" \
              --jq '.body // ""' 2>/dev/null || true)
            [ -n "$PR_BODY" ] && {
              echo ""                     >> "$CONTENT_FILE"
              echo "### PR Description"   >> "$CONTENT_FILE"
              echo "${PR_BODY}"           >> "$CONTENT_FILE"
            }

            FIRST_COMMENT=$(gh api \
              "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments?per_page=1" \
              --jq '.[0].body // ""' 2>/dev/null || true)
            [ -n "$FIRST_COMMENT" ] && {
              echo ""                       >> "$CONTENT_FILE"
              echo "### PR First Comment"   >> "$CONTENT_FILE"
              echo "${FIRST_COMMENT}"       >> "$CONTENT_FILE"
            }
          fi

          DELIM="CHANGES_$(openssl rand -hex 8)"
          {
            echo "content<<${DELIM}"
            cat "$CONTENT_FILE"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Write changelog.md and release body
        if: steps.check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          REPO="${{ github.repository }}"
          CHANGELOG_URL="https://github.com/${REPO}/releases/download/${VERSION}/changelog.md"

          # Write collected changes directly to changelog.md
          cat << 'EOF' > dist/changelog.md
          ${{ steps.changes.outputs.content }}
          EOF

          # Build full release body
          cat > dist/release_body.md <<'BODY_EOF'
          ## ViPER4Android Reverse Engineered VERSION_PLACEHOLDER (AIDL)

          BODY_EOF
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/" dist/release_body.md
          cat dist/changelog.md >> dist/release_body.md

      - name: Publish release
        if: steps.check.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.check.outputs.version }}
          name: "ViPER4Android RE ${{ steps.check.outputs.version }}"
          draft: false
          prerelease: ${{ contains(steps.check.outputs.version, '-') }}
          files: |
            dist/*.zip
            dist/update.json
            dist/changelog.md
          body_path: dist/release_body.md